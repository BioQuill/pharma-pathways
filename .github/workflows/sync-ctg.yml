name: Sync CTG nightly
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm ci
      - name: Run sync
        run: node scripts/sync_ctg.js
      - name: Upload DB artifact
        uses: actions/upload-artifact@v4
        with:
          name: trials-db
          path: data/trials.db
